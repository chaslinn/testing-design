<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{width:700px;font-family:var(--font-body);background:#fff;padding:20px 24px;box-sizing:border-box;display:flex;gap:14px;align-items:stretch}
  .ph{flex:1;border-radius:16px;overflow:hidden;height:150px;position:relative}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .cap{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;color:#fff;font-size:11.5px;font-weight:700;background:linear-gradient(transparent,rgba(0,0,0,.55))}
</style>
</head>
<body>
  <div class="ph"><img src="../assets/impact.png" alt="child eating fruit"><span class="cap">Warm · documentary · real families</span></div>
  <div class="ph"><img src="../assets/food-shopping.png" alt="fresh produce"><span class="cap">Fresh produce · natural light</span></div>
  <div class="ph"><img src="../assets/cb-webpicture.png" alt="app in hand"><span class="cap">Product in-context · phone in-hand</span></div>
</body>
</html>
