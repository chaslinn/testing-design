<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  html,body{margin:0}
  body{width:700px;font-family:var(--font-body);background:var(--cb-paper);padding:24px 26px;box-sizing:border-box;display:flex;gap:16px}
  .coupon{width:200px;background:#fff;border:1px solid var(--cb-line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-md)}
  .ctop{position:relative;height:120px;background:var(--cb-mist);display:flex;align-items:center;justify-content:center}
  .ctop .prod{font-size:13px;font-weight:800;color:var(--fg-3)}
  .disc{position:absolute;top:8px;left:8px;background:var(--cb-green);color:#06382A;font-weight:900;font-size:14px;padding:3px 9px;border-radius:8px}
  .ret{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:999px;background:#C8202E;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;box-shadow:var(--shadow-sm)}
  .cbody{padding:11px 12px 13px}
  .cbody h4{margin:0 0 7px;font:800 14px/1.25 var(--font-display);color:var(--cb-ink)}
  .exp{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--fg-3);font-weight:600}
  .exp svg{width:13px;height:13px}
  .meta{display:flex;flex-direction:column;justify-content:center;gap:8px;color:var(--fg-3);font-size:13px;font-weight:600}
  .meta b{color:var(--fg-1);font-size:15px}
</style>
</head>
<body>
  <div class="coupon">
    <div class="ctop"><span class="disc">-100%</span><span class="ret">N&amp;N</span><span class="prod">🥛 product image</span></div>
    <div class="cbody"><h4>Lakeland Dairies Semi-Skimmed Milk</h4><div class="exp"><i data-lucide="calendar"></i> 31/10/2025</div></div>
  </div>
  <div class="meta">
    <b>Promotion coupon card</b>
    Discount badge · retailer chip<br>product · name · expiry date<br>The core repeating unit of the E4E app.
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
