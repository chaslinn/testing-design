<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{width:700px;font-family:var(--font-body);background:var(--cb-white);padding:24px 28px;box-sizing:border-box}
  .specimen{display:flex;flex-direction:column;gap:8px}
  .line{display:flex;align-items:baseline;gap:14px}
  .tag{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);width:78px;flex:0 0 auto}
</style>
</head>
<body>
  <div class="specimen">
    <div class="line"><span class="tag">display 800</span><span style="font:800 40px/1 var(--font-display);letter-spacing:-.02em;color:var(--cb-ink)">Impact First</span></div>
    <div class="line"><span class="tag">h1 800</span><span style="font:800 30px/1 var(--font-display);letter-spacing:-.02em;color:var(--cb-ink)">Essentials for Everyone</span></div>
    <div class="line"><span class="tag">h2 800</span><span style="font:800 23px/1 var(--font-display);color:var(--cb-ink)">Joined Up Thinking</span></div>
    <div class="line"><span class="tag">h3 700</span><span style="font:700 18px/1 var(--font-display);color:var(--cb-ink)">Dignity · Affordability · Access</span></div>
  </div>
</body>
</html>
