<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  html,body{margin:0}
  body{width:700px;font-family:var(--font-body);background:#fff;padding:0;box-sizing:border-box}
  .nav{display:flex;justify-content:space-around;align-items:center;padding:11px 26px 12px;border-top:1px solid var(--cb-line);background:#fff}
  .it{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--cb-ink-400);font:700 10px/1 var(--font-body);letter-spacing:.03em}
  .it svg{width:23px;height:23px}
  .it.active{color:var(--cb-green-700)}
  .menu-btn{width:52px;height:30px;border:1.5px solid var(--cb-line-strong);border-radius:9px;display:flex;align-items:center;justify-content:center}
  .lab{padding:14px 26px 8px;font-size:13px;color:var(--fg-3);font-weight:600}
</style>
</head>
<body>
  <div class="lab">App bottom navigation — HOME · INTERESTS · PROFILE · MENU (outlined trigger)</div>
  <div class="nav">
    <div class="it active"><i data-lucide="house"></i>HOME</div>
    <div class="it"><i data-lucide="smile"></i>INTERESTS</div>
    <div class="it"><i data-lucide="user"></i>PROFILE</div>
    <div class="it"><span class="menu-btn"><i data-lucide="menu" style="width:20px;height:20px;color:var(--cb-ink-700)"></i></span>MENU</div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
