<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{width:700px;font-family:var(--font-body);background:#fff;padding:22px 26px;box-sizing:border-box}
  .row{display:flex;gap:18px;align-items:center;justify-content:space-between}
  .logo{width:80px;height:80px;border-radius:999px;object-fit:cover;border:1px solid var(--cb-line);background:#fff}
  .lab{margin-top:14px;font-size:13px;color:var(--fg-3);font-weight:600}
</style>
</head>
<body>
  <div class="row">
    <img class="logo" src="../assets/partner-gmca.png" alt="GMCA">
    <img class="logo" src="../assets/partner-livewell.png" alt="Livewell">
    <img class="logo" src="../assets/partner-brick.png" alt="The Brick">
    <img class="logo" src="../assets/partner-sheffield.png" alt="Sheffield">
    <img class="logo" src="../assets/partner-odi.png" alt="ODI">
    <img class="logo" src="../assets/partner-nn.png" alt="N&amp;N">
  </div>
  <div class="lab">Partner logos — round tiles, even row (GMCA · Livewell · The Brick · Sheffield · ODI · N&amp;N)</div>
</body>
</html>
