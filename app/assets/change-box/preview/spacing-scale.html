<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{width:700px;font-family:var(--font-body);background:var(--cb-white);padding:22px 26px;box-sizing:border-box}
  .scale{display:flex;align-items:flex-end;gap:14px}
  .unit{display:flex;flex-direction:column;align-items:center;gap:6px}
  .bar{background:var(--cb-green);border-radius:4px;width:26px}
  .n{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-3)}
  .lab{margin-top:14px;font-size:13px;color:var(--fg-3);font-weight:600}
</style>
</head>
<body>
  <div class="scale">
    <div class="unit"><div class="bar" style="height:4px"></div><div class="n">4</div></div>
    <div class="unit"><div class="bar" style="height:8px"></div><div class="n">8</div></div>
    <div class="unit"><div class="bar" style="height:12px"></div><div class="n">12</div></div>
    <div class="unit"><div class="bar" style="height:16px"></div><div class="n">16</div></div>
    <div class="unit"><div class="bar" style="height:20px"></div><div class="n">20</div></div>
    <div class="unit"><div class="bar" style="height:24px"></div><div class="n">24</div></div>
    <div class="unit"><div class="bar" style="height:32px"></div><div class="n">32</div></div>
    <div class="unit"><div class="bar" style="height:40px"></div><div class="n">40</div></div>
    <div class="unit"><div class="bar" style="height:48px"></div><div class="n">48</div></div>
    <div class="unit"><div class="bar" style="height:64px"></div><div class="n">64</div></div>
    <div class="unit"><div class="bar" style="height:80px"></div><div class="n">80</div></div>
  </div>
  <div class="lab">Spacing scale — 4px base (4 · 8 · 12 · 16 · 20 · 24 · 32 · 40 · 48 · 64 · 80)</div>
</body>
</html>
