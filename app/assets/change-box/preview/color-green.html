<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{width:700px;font-family:var(--font-body);background:var(--cb-white);padding:22px 26px;box-sizing:border-box}
  .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
  .sw{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
  .sw b{font-size:12.5px;font-weight:800}
  .sw span{font-family:var(--font-mono);font-size:11px;opacity:.85}
  .lab{margin-top:12px;font-size:13px;color:var(--fg-3);font-weight:600}
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:#EEFBF6;color:#0E9A71"><b>50</b><span>#EEFBF6</span></div>
    <div class="sw" style="background:#D6F7EC;color:#0E9A71"><b>100</b><span>#D6F7EC</span></div>
    <div class="sw" style="background:#6FE0BD;color:#06382A"><b>300</b><span>#6FE0BD</span></div>
    <div class="sw" style="background:#1DCD96;color:#06382A"><b>500 · brand</b><span>#1DCD96</span></div>
    <div class="sw" style="background:#14B384;color:#fff"><b>600</b><span>#14B384</span></div>
    <div class="sw" style="background:#0E9A71;color:#fff"><b>700</b><span>#0E9A71</span></div>
  </div>
  <div class="lab">Change Box Green — primary brand scale</div>
</body>
</html>
