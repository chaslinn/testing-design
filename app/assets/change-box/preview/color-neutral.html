<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{width:700px;font-family:var(--font-body);background:var(--cb-white);padding:22px 26px;box-sizing:border-box}
  .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
  .sw{flex:1;height:88px;display:flex;flex-direction:column;justify-content:flex-end;padding:9px;box-sizing:border-box}
  .sw b{font-size:12px;font-weight:800}
  .sw span{font-family:var(--font-mono);font-size:10.5px;opacity:.85}
  .lab{margin-top:12px;font-size:13px;color:var(--fg-3);font-weight:600}
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:#272F3A;color:#fff"><b>Ink</b><span>#272F3A</span></div>
    <div class="sw" style="background:#3A4453;color:#fff"><b>700</b><span>#3A4453</span></div>
    <div class="sw" style="background:#5A6577;color:#fff"><b>500</b><span>#5A6577</span></div>
    <div class="sw" style="background:#8B95A5;color:#fff"><b>400</b><span>#8B95A5</span></div>
    <div class="sw" style="background:#E4E8E7;color:#3A4453"><b>line</b><span>#E4E8E7</span></div>
    <div class="sw" style="background:#F2F4F3;color:#3A4453"><b>mist</b><span>#F2F4F3</span></div>
    <div class="sw" style="background:#FBFAF7;color:#3A4453;border-right:1px solid #E4E8E7"><b>paper</b><span>#FBFAF7</span></div>
  </div>
  <div class="lab">Ink &amp; warm neutrals — text, borders, surfaces</div>
</body>
</html>
