{% extends "layouts/main.html" %}

{% block content %}
<div class="govuk-grid-row">
  <div class="govuk-grid-column-one-quarter">
    {% include "change-box-ds/_sidenav.html" %}
  </div>
  <div class="govuk-grid-column-three-quarters">
    {% block ds_content %}{% endblock %}
  </div>
</div>

<style>
  /* .cb-preview and .cb-callout are themed by application.scss */
  .cb-preview { width: 100%; display: block; background: #fff; }
  .cb-callout { padding: 16px 20px; margin: 16px 0 24px; border-radius: 6px; }
  .cb-spec { background: #f3f2f1; padding: 12px 16px; border-radius: 8px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; }
  .cb-spec-label { display: inline-block; min-width: 120px; color: #505a5f; }
</style>
{% endblock %}
